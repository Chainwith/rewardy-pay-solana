<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55dfce"/>
      <stop offset="1" stop-color="#6c83ed"/>
    </linearGradient>
    <linearGradient id="wallet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8bbbf8"/>
      <stop offset="1" stop-color="#61ead4"/>
    </linearGradient>
    <linearGradient id="chain" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6686e8"/>
      <stop offset="1" stop-color="#7b93ef"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#4c5870" flood-opacity=".11"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#7591ed"/>
    </marker>
    <marker id="arrowMint" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#32bba8"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#f5f7fb"/>
  <rect width="1600" height="6" fill="url(#top)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(72 44)">
      <rect width="46" height="46" rx="13" fill="url(#wallet)"/>
      <path d="M12 17c3-6 19-6 22 0v12c-3 6-19 6-22 0Z" fill="#fff"/>
      <circle cx="18" cy="23" r="2" fill="#30394b"/>
      <circle cx="28" cy="23" r="2" fill="#30394b"/>
      <path d="M17 31c4 2 8 2 12 0" fill="none" stroke="#718095" stroke-width="1.5" stroke-linecap="round"/>
      <text x="62" y="31" fill="#20242d" font-size="26" font-weight="700">Rewardy PAY</text>
    </g>
    <text x="72" y="178" fill="#1c2028" font-size="54" font-weight="700">Solana payment architecture</text>
    <text x="72" y="225" fill="#646d7e" font-size="23">One payment session connects the merchant QR, wallet signature, settlement and reward.</text>

    <g transform="translate(72 292)">
      <text x="0" y="0" fill="#7890be" font-size="14" font-weight="700">01</text>
      <text x="42" y="0" fill="#788397" font-size="14" font-weight="700">PAYMENT ENTRY</text>
      <rect y="28" width="290" height="360" rx="30" fill="#fff" stroke="#dce3f1" stroke-width="2" filter="url(#shadow)"/>
      <rect x="28" y="62" width="58" height="58" rx="17" fill="#eef2fd"/>
      <path d="M44 79h26v24H44M40 84v-8h8M74 84v-8h-8M40 98v9h8M74 98v9h-8" fill="none" stroke="#47505f" stroke-width="3" stroke-linecap="round"/>
      <text x="102" y="86" fill="#6682e5" font-size="24" font-weight="700">Start the order</text>
      <text x="28" y="155" fill="#20252d" font-size="19" font-weight="700">Merchant phone</text>
      <text x="28" y="183" fill="#7a8496" font-size="16">Enter amount and order</text>
      <line x1="28" y1="211" x2="262" y2="211" stroke="#e2e7f1" stroke-width="2"/>
      <text x="28" y="251" fill="#20252d" font-size="19" font-weight="700">Payment QR</text>
      <text x="28" y="279" fill="#7a8496" font-size="16">Open the checkout session</text>
      <rect x="28" y="314" width="234" height="46" rx="14" fill="#f2f5fd"/>
      <text x="145" y="343" text-anchor="middle" fill="#627de0" font-size="16" font-weight="700">Amount + order reference</text>
    </g>

    <line x1="378" y1="500" x2="430" y2="500" stroke="#7591ed" stroke-width="5" marker-end="url(#arrowBlue)"/>

    <g transform="translate(448 292)">
      <text x="0" y="0" fill="#23a997" font-size="14" font-weight="700">02</text>
      <text x="42" y="0" fill="#788397" font-size="14" font-weight="700">WALLET ACCESS</text>
      <rect y="28" width="290" height="360" rx="30" fill="#fff" stroke="#dce3f1" stroke-width="2" filter="url(#shadow)"/>
      <rect x="28" y="62" width="58" height="58" rx="17" fill="#e7faf6"/>
      <rect x="39" y="73" width="36" height="36" rx="11" fill="url(#wallet)"/>
      <path d="M46 84c3-5 19-5 22 0v11c-3 5-19 5-22 0Z" fill="#fff"/>
      <circle cx="52" cy="89" r="1.6" fill="#334052"/>
      <circle cx="62" cy="89" r="1.6" fill="#334052"/>
      <text x="102" y="86" fill="#17aa98" font-size="24" font-weight="700">Rewardy Wallet</text>
      <text x="28" y="155" fill="#20252d" font-size="19" font-weight="700">Review payment</text>
      <text x="28" y="183" fill="#7a8496" font-size="16">Merchant, amount and fee</text>
      <line x1="28" y1="211" x2="262" y2="211" stroke="#e2e7f1" stroke-width="2"/>
      <text x="28" y="251" fill="#20252d" font-size="19" font-weight="700">Approve and sign</text>
      <text x="28" y="279" fill="#7a8496" font-size="16">Customer controls the wallet</text>
      <rect x="28" y="314" width="234" height="46" rx="14" fill="#eaf9f6"/>
      <text x="145" y="343" text-anchor="middle" fill="#159784" font-size="16" font-weight="700">Payer signature</text>
    </g>

    <line x1="754" y1="500" x2="806" y2="500" stroke="#7591ed" stroke-width="5" marker-end="url(#arrowBlue)"/>

    <g transform="translate(824 264)">
      <text x="0" y="28" fill="#7656d7" font-size="14" font-weight="700">03</text>
      <text x="42" y="28" fill="#788397" font-size="14" font-weight="700">SOLANA SETTLEMENT</text>
      <rect y="56" width="386" height="416" rx="34" fill="url(#chain)" filter="url(#shadow)"/>
      <circle cx="58" cy="110" r="28" fill="#11141c"/>
      <path d="M43 99h31l-6 7H37Zm-6 10h31l6 7H43Zm6 10h31l-6 7H37Z" fill="url(#top)"/>
      <text x="102" y="106" fill="#dce5ff" font-size="15" font-weight="700">SOLANA TRANSACTION</text>
      <text x="36" y="166" fill="#fff" font-size="31" font-weight="700">Atomic settlement</text>
      <rect x="36" y="196" width="314" height="50" rx="15" fill="#fff" fill-opacity=".14"/>
      <text x="56" y="227" fill="#fff" font-size="17" font-weight="700">Memo</text>
      <text x="330" y="227" text-anchor="end" fill="#e5ebff" font-size="16">order reference</text>
      <rect x="36" y="260" width="150" height="108" rx="20" fill="#fff" fill-opacity=".14"/>
      <text x="111" y="291" text-anchor="middle" fill="#dce5ff" font-size="13" font-weight="700">MERCHANT</text>
      <text x="111" y="333" text-anchor="middle" fill="#fff" font-size="34" font-weight="700">9.97</text>
      <rect x="200" y="260" width="150" height="108" rx="20" fill="#fff" fill-opacity=".14"/>
      <text x="275" y="291" text-anchor="middle" fill="#dce5ff" font-size="13" font-weight="700">REWARDY FEE</text>
      <text x="275" y="333" text-anchor="middle" fill="#fff" font-size="34" font-weight="700">0.03</text>
      <text x="36" y="412" fill="#dce5ff" font-size="16">Both transfers succeed together.</text>
      <text x="36" y="438" fill="#dce5ff" font-size="16">Recorded network fee: 0.000005 SOL</text>
    </g>

    <line x1="1226" y1="500" x2="1278" y2="500" stroke="#32bba8" stroke-width="5" marker-end="url(#arrowMint)"/>

    <g transform="translate(1296 292)">
      <text x="0" y="0" fill="#c69316" font-size="14" font-weight="700">04</text>
      <text x="42" y="0" fill="#788397" font-size="14" font-weight="700">VERIFY &amp; REWARD</text>
      <rect y="28" width="232" height="360" rx="30" fill="#fff" stroke="#dce3f1" stroke-width="2" filter="url(#shadow)"/>
      <circle cx="48" cy="88" r="30" fill="#7da2f2"/>
      <path d="M35 88l9 9 18-21" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="152" fill="#20252d" font-size="22" font-weight="700">Confirm result</text>
      <text x="28" y="189" fill="#7a8496" font-size="16">Verify signer and mint</text>
      <text x="28" y="216" fill="#7a8496" font-size="16">Check exact recipients</text>
      <text x="28" y="243" fill="#7a8496" font-size="16">Wait for finality</text>
      <line x1="28" y1="274" x2="204" y2="274" stroke="#e2e7f1" stroke-width="2"/>
      <text x="28" y="312" fill="#20252d" font-size="18" font-weight="700">Paid receipt</text>
      <text x="28" y="340" fill="#1aaa97" font-size="18" font-weight="700">Reward eligible</text>
    </g>

    <rect x="306" y="764" width="988" height="74" rx="26" fill="#fff" stroke="#cfdbfa" stroke-width="2"/>
    <text x="800" y="810" text-anchor="middle" fill="#637fe0" font-size="21" font-weight="700">One payment session links the order, Solana transaction, receipt and reward.</text>
    <text x="72" y="870" fill="#8993a5" font-size="15">Working Devnet path shown. Jupiter, cross-chain routing and local payout partners remain outside this proof.</text>
  </g>
</svg>
