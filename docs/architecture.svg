<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9ff"/>
      <stop offset="1" stop-color="#effdf9"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7296f7"/>
      <stop offset="1" stop-color="#56e4d1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#53627c" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#7e9bf2"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="6" fill="url(#brand)"/>
  <text x="90" y="94" fill="#17202d" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Rewardy PAY</text>
  <text x="90" y="180" fill="#171b24" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700">From wallet assets to local utility</text>
  <text x="90" y="230" fill="#657086" font-family="Arial, Helvetica, sans-serif" font-size="24">One QR payment session. One signed Solana transaction. One verifiable receipt.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(80 330)" filter="url(#shadow)">
      <rect width="250" height="260" rx="28" fill="#fff" stroke="#dce4f5" stroke-width="2"/>
      <circle cx="125" cy="75" r="38" fill="#e8fff9"/>
      <path d="M102 66h46v38h-46zM96 66l8-15h42l8 15" fill="none" stroke="#24b9a8" stroke-width="5" stroke-linejoin="round"/>
      <text x="125" y="150" text-anchor="middle" fill="#202632" font-size="25" font-weight="700">Merchant phone</text>
      <text x="125" y="190" text-anchor="middle" fill="#778195" font-size="18">Create amount</text>
      <text x="125" y="218" text-anchor="middle" fill="#778195" font-size="18">and payment QR</text>
    </g>

    <line x1="340" y1="460" x2="410" y2="460" stroke="#7e9bf2" stroke-width="5" marker-end="url(#arrow)"/>

    <g transform="translate(430 330)" filter="url(#shadow)">
      <rect width="250" height="260" rx="28" fill="#fff" stroke="#dce4f5" stroke-width="2"/>
      <circle cx="125" cy="75" r="38" fill="#eef2ff"/>
      <path d="M104 54h42v42h-42zM110 60h9v9h-9zM131 60h9v9h-9zM110 81h9v9h-9zM128 78h12v12h-12z" fill="#718ff0"/>
      <text x="125" y="150" text-anchor="middle" fill="#202632" font-size="25" font-weight="700">Payment session</text>
      <text x="125" y="190" text-anchor="middle" fill="#778195" font-size="18">Locked amount</text>
      <text x="125" y="218" text-anchor="middle" fill="#778195" font-size="18">and order reference</text>
    </g>

    <line x1="690" y1="460" x2="760" y2="460" stroke="#7e9bf2" stroke-width="5" marker-end="url(#arrow)"/>

    <g transform="translate(780 330)" filter="url(#shadow)">
      <rect width="250" height="260" rx="28" fill="#fff" stroke="#dce4f5" stroke-width="2"/>
      <circle cx="125" cy="75" r="38" fill="url(#brand)"/>
      <rect x="109" y="49" width="32" height="53" rx="7" fill="none" stroke="#fff" stroke-width="5"/>
      <circle cx="125" cy="93" r="2.5" fill="#fff"/>
      <text x="125" y="150" text-anchor="middle" fill="#202632" font-size="25" font-weight="700">Rewardy Wallet</text>
      <text x="125" y="190" text-anchor="middle" fill="#778195" font-size="18">Review payment</text>
      <text x="125" y="218" text-anchor="middle" fill="#778195" font-size="18">and sign</text>
    </g>

    <line x1="1040" y1="460" x2="1110" y2="460" stroke="#7e9bf2" stroke-width="5" marker-end="url(#arrow)"/>

    <g transform="translate(1130 300)" filter="url(#shadow)">
      <rect width="390" height="320" rx="32" fill="#6788eb"/>
      <text x="195" y="54" text-anchor="middle" fill="#dfe8ff" font-size="18" font-weight="700">SOLANA</text>
      <text x="195" y="105" text-anchor="middle" fill="#fff" font-size="32" font-weight="700">Atomic settlement</text>
      <rect x="45" y="140" width="300" height="48" rx="16" fill="#7f9af0"/>
      <text x="195" y="171" text-anchor="middle" fill="#fff" font-size="18">Memo · order reference</text>
      <rect x="45" y="202" width="142" height="72" rx="18" fill="#fff" fill-opacity=".14"/>
      <text x="116" y="231" text-anchor="middle" fill="#dfe8ff" font-size="15">MERCHANT</text>
      <text x="116" y="257" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">9.97</text>
      <rect x="203" y="202" width="142" height="72" rx="18" fill="#fff" fill-opacity=".14"/>
      <text x="274" y="231" text-anchor="middle" fill="#dfe8ff" font-size="15">REWARDY FEE</text>
      <text x="274" y="257" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">0.03</text>
    </g>

    <g transform="translate(430 690)">
      <rect width="740" height="96" rx="28" fill="#fff" stroke="#cad8fb" stroke-width="2"/>
      <circle cx="56" cy="48" r="24" fill="#63d7c9"/>
      <path d="M45 48l8 8 16-18" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="96" y="43" fill="#222a37" font-size="22" font-weight="700">Rewardy verifies before marking the order paid</text>
      <text x="96" y="70" fill="#758096" font-size="17">Signer · mint · recipients · exact amounts · finality</text>
    </g>
    <line x1="1325" y1="630" x2="1175" y2="708" stroke="#5fd6c6" stroke-width="4" marker-end="url(#arrow)"/>
  </g>
  <text x="90" y="850" fill="#8b95a7" font-family="Arial, Helvetica, sans-serif" font-size="16">Devnet evaluation architecture · Production integrations are documented separately.</text>
</svg>
